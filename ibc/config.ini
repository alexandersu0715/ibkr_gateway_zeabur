# =============================================================================
# IBC Configuration for Zeabur Docker
# =============================================================================

# 1. 交易模式設定
# 確保是小寫 paper
TradingMode=paper

# 2. 帳密佔位符 (由 Dockerfile 中的 sed 命令替換)
IBUsername=YOUR_USERNAME
IBPassword=YOUR_PASSWORD

# 3. 關鍵路徑設定 (必須與 Dockerfile 中的 TWS_PATH 一致)
# IBC 需要知道 TWS 安裝在哪裡
IbDir=/opt/ibgateway

# 4. API 伺服器設定
# 必須開啟，否則 Python 連不上
IbPort=4002
# 關閉「唯讀」模式，否則無法下單購買 SWRD
ReadOnlyApi=no
# 自動接受來自 localhost (127.0.0.1) 的連線
AcceptIncomingConnection=yes
# 自動接受訂單確認彈窗
AcceptOrders=yes

# 5. 自動化行為 (避免卡住的關鍵)
# 如果偵測到已有其他 Session，強制踢掉舊的 (確保雲端重啟順利)
ExistingSessionDetectedAction=primary
# 當遇到 2FA 超時，讓它自動重啟再試一次
TwoFactorTimeoutAction=restart
# 遇到特定錯誤時自動點擊確認
ConfirmUpdateV1=yes

# 6. 時間與重啟設定
# 留空代表不設定自動關機時間
ClosedownAt=
# 每天重啟一次以保持連線新鮮 (UTC 時間)
FIX=1
