# 設定為 paper 代表模擬倉，live 代表實盤
TradingMode=paper

# 自動登入資訊 (會由 Docker 動態替換)
IBUsername=YOUR_USERNAME
IBPassword=YOUR_PASSWORD

# API 連接埠設定 (必須與 Python 程式碼一致)
# 模擬倉 Gateway 預設通常是 4002
IbPort=4002

# 重要：自動處理 API 確認彈窗
AcceptIncomingConnection=yes
AcceptOrders=yes

# 避免啟動時卡在「僅限讀取」的警告
ReadOnlyApi=no

# 抑制某些每日重啟的確認框
ClosedownAt=